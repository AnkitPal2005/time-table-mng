<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | ScheduleSync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --bg-primary: #ffffff;
            --border-color: #e5e7eb;
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius-lg: 0.75rem;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .forgot-container {
            background: var(--bg-primary);
            padding: 3rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 450px;
            margin: 1rem;
        }

        .forgot-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .forgot-header h2 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .forgot-subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .forgot-form {
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            transition: all 0.2s ease;
            background: var(--bg-primary);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgb(99 102 241 / 0.1);
        }

        .forgot-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-lg);
        }

        .forgot-btn:hover {
            transform: translateY(-2px);
        }

        .forgot-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .otp-form {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .form-help {
            display: block;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        .forgot-footer {
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .forgot-footer p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .forgot-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-footer a:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: var(--radius-lg);
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: block;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }

        .message.info {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.2);
            display: block;
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <div class="forgot-header">
            <h2>🔐 Reset Password</h2>
            <p class="forgot-subtitle">Enter your email address and we'll send you a verification code to reset your password.</p>
        </div>
        
        <div class="forgot-form">
            <!-- Step 1: Send OTP -->
            <form id="forgotForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your registered email" required>
                </div>
                <button type="submit" class="forgot-btn" id="send-btn">
                    Send Verification Code
                </button>
            </form>

            <!-- Step 2: Verify OTP -->
            <form id="verifyOtpForm" class="otp-form">
                <div class="form-group">
                    <label for="otp">Verification Code</label>
                    <input type="text" id="otp" maxlength="6" placeholder="Enter 6-digit code" required>
                    <small class="form-help">Check your email for the verification code</small>
                </div>
                <button type="submit" class="forgot-btn" id="verify-btn">
                    Verify Code
                </button>
            </form>
            
            <div id="message" class="message"></div>
        </div>
        
        <div class="forgot-footer">
            <p>Remember your password? <a href="/">Back to Sign In</a></p>
        </div>
    </div>

    <script>
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const button = document.getElementById('send-btn');
            
            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }
            
            button.disabled = true;
            button.textContent = 'Sending...';
            
            try {
                const response = await fetch('/otp/send-otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage(data.message, 'success');
                    document.getElementById('verifyOtpForm').style.display = 'block';
                    document.getElementById('forgotForm').style.display = 'none';
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Connection error. Please try again.', 'error');
            } finally {
                button.disabled = false;
                button.textContent = 'Send Verification Code';
            }
        });

        document.getElementById('verifyOtpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const button = document.getElementById('verify-btn');
            
            if (!otp) {
                showMessage('Please enter the verification code', 'error');
                return;
            }
            
            if (otp.length !== 6) {
                showMessage('Verification code must be 6 digits', 'error');
                return;
            }
            
            button.disabled = true;
            button.textContent = 'Verifying...';
            
            try {
                const response = await fetch('/otp/verify-otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, otp }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Verification successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = `/reset-password.html?email=${encodeURIComponent(email)}`;
                    }, 1500);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Connection error. Please try again.', 'error');
            } finally {
                button.disabled = false;
                button.textContent = 'Verify Code';
            }
        });
    </script>
</body>
</html>
