<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | ScheduleSync</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root {
      --primary-color: #6366f1;
      --secondary-color: #8b5cf6;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --bg-primary: #ffffff;
      --border-color: #e5e7eb;
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      --radius-lg: 0.75rem;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .reset-form {
      background: var(--bg-primary);
      padding: 3rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 450px;
      margin: 1rem;
    }

    .reset-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .reset-header h2 {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .reset-subtitle {
      color: var(--text-secondary);
      font-size: 0.875rem;
      line-height: 1.5;
    }

    .reset-form-content {
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.875rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.875rem 1rem;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-lg);
      transition: all 0.2s ease;
      background: var(--bg-primary);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgb(99 102 241 / 0.1);
    }

    .form-help {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    .reset-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-lg);
    }

    .reset-btn:hover {
      transform: translateY(-2px);
    }

    .reset-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .reset-footer {
      text-align: center;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
    }

    .reset-footer p {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .reset-footer a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
    }

    .reset-footer a:hover {
      text-decoration: underline;
    }

    .message {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: var(--radius-lg);
      font-size: 0.875rem;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2);
      display: block;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
      display: block;
    }
  </style>
</head>
<body>
  <div class="reset-form">
    <div class="reset-header">
      <h2>🔑 Create New Password</h2>
      <p class="reset-subtitle">Your new password must be different from your previous password</p>
    </div>
    
    <div class="reset-form-content">
      <form method="POST" onsubmit="resetPassword(event)">
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your new password" required>
          <small class="form-help">Password must be at least 6 characters long</small>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your new password" required>
        </div>
        
        <button type="submit" class="reset-btn" id="reset-button">
          Update Password
        </button>
      </form>
      
      <div id="message" class="message"></div>
    </div>
    
    <div class="reset-footer">
      <p>Remember your password? <a href="/">Back to Sign In</a></p>
    </div>
  </div>

  <script>
    function showMessage(message, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = message;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
    }

    function validatePasswords() {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (!password) {
        showMessage('Please enter a new password', 'error');
        return false;
      }
      
      if (password.length < 6) {
        showMessage('Password must be at least 6 characters long', 'error');
        return false;
      }
      
      if (!confirmPassword) {
        showMessage('Please confirm your password', 'error');
        return false;
      }
      
      if (password !== confirmPassword) {
        showMessage('Passwords do not match', 'error');
        return false;
      }
      
      return true;
    }

    async function resetPassword(event) {
      event.preventDefault();
      
      if (!validatePasswords()) return;
      
      const password = document.getElementById('password').value;
      const button = document.getElementById('reset-button');
      
      button.disabled = true;
      button.textContent = 'Updating...';
      
      try {
        const response = await fetch('/api/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ newPassword: password }),
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage('Password updated successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 2000);
        } else {
          showMessage(data.message || 'Failed to update password', 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        showMessage('Connection error. Please try again.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Update Password';
      }
    }
  </script>
</body>
</html>
