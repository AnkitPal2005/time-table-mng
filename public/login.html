<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | ScheduleSync</title>
    <style>
      /* Optimized CSS - inline for faster loading */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      :root {
        --primary-color: #6366f1;
        --secondary-color: #8b5cf6;
        --text-primary: #1f2937;
        --text-secondary: #6b7280;
        --bg-primary: #ffffff;
        --border-color: #e5e7eb;
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        --radius-lg: 0.75rem;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .login-container {
        display: flex;
        width: 100%;
        max-width: 900px;
        min-height: 500px;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        overflow: hidden;
        background: var(--bg-primary);
      }

      .login-left {
        width: 50%;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem;
        position: relative;
      }

      .login-left h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 1rem;
        text-align: center;
        line-height: 1.2;
      }

      .login-left p {
        text-align: center;
        font-size: 1.125rem;
        opacity: 0.9;
        line-height: 1.6;
      }

      .features {
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .feature {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.875rem;
      }

      .feature-icon {
        font-size: 1.25rem;
      }

      .login-right {
        width: 50%;
        background: var(--bg-primary);
        padding: 3rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .login-right h2 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 2rem;
        text-align: center;
        color: var(--text-primary);
      }

      .login-subtitle {
        color: var(--text-secondary);
        margin-bottom: 2rem;
        font-size: 0.875rem;
        text-align: center;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: var(--text-primary);
        font-size: 0.875rem;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 0.875rem 1rem;
        font-size: 1rem;
        border: 2px solid var(--border-color);
        border-radius: var(--radius-lg);
        transition: all 0.2s ease;
        background: var(--bg-primary);
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgb(99 102 241 / 0.1);
      }

      .login-btn {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: white;
        border: none;
        font-weight: 600;
        font-size: 1rem;
        border-radius: var(--radius-lg);
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: var(--shadow-lg);
      }

      .login-btn:hover {
        transform: translateY(-2px);
      }

      .login-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .form-footer {
        margin-top: 1.5rem;
        text-align: center;
      }

      .forgot-btn {
        background: none;
        border: none;
        color: var(--primary-color);
        cursor: pointer;
        font-size: 0.875rem;
        text-decoration: underline;
        margin-bottom: 1rem;
      }

      .signup-link {
        font-size: 0.875rem;
        color: var(--text-secondary);
      }

      .signup-link a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
      }

      .signup-link a:hover {
        text-decoration: underline;
      }

      .message {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: var(--radius-lg);
        font-size: 0.875rem;
        font-weight: 500;
        text-align: center;
        display: none;
      }

      .message.success {
        background: rgba(16, 185, 129, 0.1);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.2);
        display: block;
      }

      .message.error {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.2);
        display: block;
      }

      @media (max-width: 768px) {
        .login-container {
          flex-direction: column;
          max-width: 400px;
        }
        
        .login-left,
        .login-right {
          width: 100%;
        }
        
        .login-left {
          padding: 2rem;
        }
        
        .login-left h1 {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-left">
        <div class="login-left-content">
          <h1>Welcome Back!</h1>
          <p>Login to manage or view your schedule with our modern, intuitive platform.</p>
          <div class="features">
            <div class="feature">
              <span class="feature-icon">📅</span>
              <span>Smart Scheduling</span>
            </div>
            <div class="feature">
              <span class="feature-icon">👥</span>
              <span>Team Management</span>
            </div>
            <div class="feature">
              <span class="feature-icon">📊</span>
              <span>Analytics Dashboard</span>
            </div>
          </div>
        </div>
      </div>
      <div class="login-right">
        <div class="login-form">
          <h2>Sign In</h2>
          <p class="login-subtitle">Enter your credentials to access your account</p>

          <div class="form-group">
            <label for="login-username">Email Address</label>
            <input type="email" id="login-username" placeholder="Enter your email" required />
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Enter your password" required />
          </div>

          <div class="form-group">
            <label for="login-role">Role</label>
            <select id="login-role" required>
              <option value="">Select your role</option>
              <option value="admin">Administrator</option>
              <option value="teacher">Teacher</option>
            </select>
          </div>

          <button type="button" onclick="login()" class="login-btn" id="login-button">
            Sign In
          </button>

          <div id="message" class="message"></div>

          <div class="form-footer">
            <button type="button" id="forgot-password-btn" class="forgot-btn">
              Forgot your password?
            </button>
            <p class="signup-link">
              Don't have an account? <a href="signup.html">Create one</a>
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      function showMessage(message, type) {
        const messageDiv = document.getElementById('message');
        messageDiv.textContent = message;
        messageDiv.className = `message ${type}`;
        messageDiv.style.display = 'block';
        
        if (type === 'success') {
          setTimeout(() => {
            messageDiv.style.display = 'none';
          }, 3000);
        }
      }

      function validateForm() {
        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value.trim();
        const role = document.getElementById("login-role").value;
        
        if (!username) {
          showMessage("Please enter your email address", "error");
          return false;
        }
        
        if (!password) {
          showMessage("Please enter your password", "error");
          return false;
        }
        
        if (!role) {
          showMessage("Please select your role", "error");
          return false;
        }
        
        // Skip email validation for admin
        if (role !== "admin") {
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(username)) {
            showMessage("Please enter a valid email address", "error");
            return false;
          }
        }
        
        return true;
      }

      async function login() {
        if (!validateForm()) return;
        
        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value.trim();
        const role = document.getElementById("login-role").value;
        const button = document.getElementById("login-button");
        
        button.disabled = true;
        button.textContent = 'Signing in...';
        
        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password, role }),
            credentials: "include",
          });
          
          const data = await response.json();
          
          if (response.ok) {
            showMessage(data.message, "success");
            localStorage.setItem("user", JSON.stringify({ user: username }));
            
            setTimeout(() => {
              if (role === "admin") {
                window.location.href = "views/admin.html";
              } else if (role === "teacher") {
                window.location.href = "views/dashboard.html";
              }
            }, 1000);
          } else {
            showMessage(data.message, "error");
          }
        } catch (err) {
          console.error("Login Error:", err);
          showMessage("Connection error. Please try again.", "error");
        } finally {
          button.disabled = false;
          button.textContent = 'Sign In';
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        document.getElementById("forgot-password-btn").addEventListener("click", () => {
          window.location.href = "forgotpassword.html";
        });
        
        document.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            login();
          }
        });
      });
    </script>
  </body>
</html>
